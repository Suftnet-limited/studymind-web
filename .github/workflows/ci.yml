name: Validate StudyMind Web
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
# Integration (`npm run test:integration`) and browser (`npm run test:e2e`) suites are intentionally NOT run here:
# they need the private studymind-ai backend, Postgres and Python dependencies. See docs/integration-testing.md.
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Type check
        run: npx tsc --noEmit
      - name: Run unit tests
        run: npm test
      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/studymind
          SESSION_SECRET: ci-only-secret-at-least-thirty-two-bytes-long
